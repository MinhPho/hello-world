# Dev environment overrides
dagster-user-deployments:
  deployments:
    - name: dagster-ray-platform
      image:
        tag: dev-latest
      env:
        DAGSTER_DEPLOYMENT: dev
        STORAGE_BUCKET: platform-data-dev
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
