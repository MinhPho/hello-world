# Production environment overrides
dagster-user-deployments:
  deployments:
    - name: dagster-ray-platform
      image:
        tag: prod-latest
      env:
        DAGSTER_DEPLOYMENT: prod
        STORAGE_BUCKET: platform-data-prod
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      replicas: 2

dagsterDaemon:
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

dagsterWebserver:
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
