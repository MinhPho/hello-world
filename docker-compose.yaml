# Local development stack for the Dagster + Ray platform.
#
# Services:
#   - postgres:  Dagster storage backend
#   - minio:     S3-compatible object storage
#   - dagster-webserver: Dagster UI
#   - dagster-daemon:    Dagster scheduler, sensor, run queue daemon
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f dagster-webserver  # follow webserver logs
#   docker compose down -v        # stop and remove volumes
#
# NOTE: Ray runs locally (LocalRay) within the Dagster process, not as
#       a separate container. This keeps the local dev experience simple.
#       For testing with a multi-node Ray cluster, see deploy/docker/Dockerfile.ray.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Dagster run/event storage
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/platform-data &&
      mc anonymous set download local/platform-data &&
      echo 'Bucket created successfully'
      "

  # ---------------------------------------------------------------------------
  # Dagster Webserver (UI)
  # ---------------------------------------------------------------------------
  dagster-webserver:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DAGSTER_DEPLOYMENT: local
      DAGSTER_PG_USERNAME: dagster
      DAGSTER_PG_PASSWORD: dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: dagster
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: platform-data
    volumes:
      - ./src:/app/src:ro  # live reload during development

  # ---------------------------------------------------------------------------
  # Dagster Daemon (scheduler, sensors, run queue)
  # ---------------------------------------------------------------------------
  dagster-daemon:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["dagster-daemon", "run", "-w", "workspace.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DAGSTER_DEPLOYMENT: local
      DAGSTER_PG_USERNAME: dagster
      DAGSTER_PG_PASSWORD: dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: dagster
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: platform-data
    volumes:
      - ./src:/app/src:ro

volumes:
  pgdata:
  miniodata:
